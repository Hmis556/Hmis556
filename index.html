<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Three.js + MediaPipe Hands：抓取交互示例</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #input-video {
            display: none;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 30, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            pointer-events: none;
            z-index: 100;
            font-size: 16px;
            letter-spacing: 0.5px;
        }
        #info-panel span {
            color: #7ec8ff;
            font-weight: 600;
            margin-left: 6px;
        }
        #hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            z-index: 100;
        }
        #interaction-hint {
            position: absolute;
            bottom: 80px;
            left: 20px;
            color: #ffaa66;
            background: rgba(30,30,40,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid #ffaa6644;
            z-index: 100;
        }
    </style>
</head>
<body>
    <video id="input-video" playsinline></video>
    <div id="info-panel">
        👋 手部状态: <span id="hand-status">等待摄像头...</span>
    </div>
    <div id="interaction-hint">
        🖐️ 靠近物体 → 高亮 | ✌️ 拇指+食指捏合 → 抓取/释放
    </div>
    <div id="hint">
        Three.js + MediaPipe Hands | 拖动视角: 鼠标/触摸
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

        // --- 配置参数 ---
        const NUM_LANDMARKS = 21;
        const SCALE = 5.0;
        const DEPTH_OFFSET = 1.0;

        // 交互阈值
        const TOUCH_DIST_THRESH = 0.5;      // 触碰高亮距离
        const PINCH_DIST_THRESH = 0.25;     // 捏合距离阈值 (拇指与食指)
        const RELEASE_DIST_THRESH = 0.35;   // 释放捏合距离阈值 (略大防止抖动)
        const GRAB_DIST_THRESH = 0.7;        // 抓取时指尖与物体的最大距离

        // 指尖索引 (MediaPipe Hand Landmarks)
        const THUMB_TIP = 4;
        const INDEX_TIP = 8;
        // 可选其他指尖，但简单起见只用拇指和食指

        // --- DOM 元素 ---
        const videoElement = document.getElementById('input-video');
        const handStatusSpan = document.getElementById('hand-status');

        // --- Three.js 场景初始化 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x11161f);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true; // 开启阴影让交互更真实
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 轨道控制器 (方便观察)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.target.set(0, 1, 0);
        controls.maxPolarAngle = Math.PI / 2;

        // --- 灯光 (为了阴影需要方向光) ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // 主光源 - 产生阴影的方向光
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(2, 5, 5);
        dirLight.castShadow = true;
        dirLight.receiveShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 8;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 2;
        dirLight.shadow.camera.far = 20;
        scene.add(dirLight);

        const fillLight = new THREE.PointLight(0x4466cc, 0.6);
        fillLight.position.set(-2, 1, 3);
        scene.add(fillLight);

        // 地面网格和接收阴影的平面 (为了物体落地阴影更明显)
        const gridHelper = new THREE.GridHelper(12, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -1.2;
        scene.add(gridHelper);

        const groundPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(12, 12),
            new THREE.ShadowMaterial({ color: 0x111122, opacity: 0.4 })
        );
        groundPlane.rotation.x = -Math.PI / 2;
        groundPlane.position.y = -1.2;
        groundPlane.receiveShadow = true;
        scene.add(groundPlane);

        // 星星背景 (粒子)
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 600;
        const starPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 50;
            starPositions[i*3+1] = (Math.random() - 0.5) * 30;
            starPositions[i*3+2] = (Math.random() - 0.5) * 50 - 20;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.15, transparent: true });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // --- 创建手部骨架 (球体 + 连线) ---
        const jointMeshes = [];
        const colors = [
            0xff5555, 0xffaa55, 0xffff55, 0x55ff55, 0x55ffff, 0x5555ff, 0xaa55ff, 0xff55aa,
            0xff8888, 0xffcc88, 0xffff88, 0x88ff88, 0x88ffff, 0x8888ff, 0xcc88ff, 0xff88cc,
            0xff9999, 0xffdd99, 0xffff99, 0x99ff99, 0x99ffff
        ];
        const sphereRadius = 0.12;
        const sphereGeom = new THREE.SphereGeometry(sphereRadius, 24, 16);
        
        for (let i = 0; i < NUM_LANDMARKS; i++) {
            const material = new THREE.MeshStandardMaterial({ 
                color: colors[i % colors.length],
                emissive: 0x222222,
                roughness: 0.3,
                metalness: 0.1
            });
            const sphere = new THREE.Mesh(sphereGeom, material);
            sphere.castShadow = true;
            sphere.receiveShadow = false; // 小球不接收阴影，节省性能
            sphere.position.set(0, 0, -10);
            scene.add(sphere);
            jointMeshes.push(sphere);
        }

        const connections = window.HAND_CONNECTIONS;
        const numSegments = connections.length;
        const vertices = new Float32Array(numSegments * 2 * 3);
        const lineGeometry = new THREE.BufferGeometry();
        lineGeometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x88ccff });
        const lineSegments = new THREE.LineSegments(lineGeometry, lineMaterial);
        scene.add(lineSegments);

        // 辅助原点
        const originSphere = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.3, transparent: true }));
        scene.add(originSphere);

        // --- 新增：可交互的物体 (方块和球体) ---
        const interactableObjects = [];
        
        // 辅助函数：生成随机颜色
        function randomColor() {
            return Math.floor(Math.random() * 0xffffff);
        }

        // 创建立方体1
        const cube1Geom = new THREE.BoxGeometry(0.6, 0.6, 0.6);
        const cube1Mat = new THREE.MeshStandardMaterial({ color: 0xff8844, emissive: 0x221100 });
        const cube1 = new THREE.Mesh(cube1Geom, cube1Mat);
        cube1.castShadow = true;
        cube1.receiveShadow = true;
        cube1.position.set(1.5, 0.2, -1.0);
        scene.add(cube1);
        interactableObjects.push({ mesh: cube1, type: 'cube', originalEmissive: 0x221100, isGrabbed: false });

        // 创建立方体2
        const cube2Geom = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const cube2Mat = new THREE.MeshStandardMaterial({ color: 0x44aaff, emissive: 0x002244 });
        const cube2 = new THREE.Mesh(cube2Geom, cube2Mat);
        cube2.castShadow = true;
        cube2.receiveShadow = true;
        cube2.position.set(-1.2, 0.3, -0.5);
        scene.add(cube2);
        interactableObjects.push({ mesh: cube2, type: 'cube', originalEmissive: 0x002244, isGrabbed: false });

        // 创建球体1
        const sphere1Geom = new THREE.SphereGeometry(0.4, 32, 16);
        const sphere1Mat = new THREE.MeshStandardMaterial({ color: 0xaa66ff, emissive: 0x220044 });
        const sphere1 = new THREE.Mesh(sphere1Geom, sphere1Mat);
        sphere1.castShadow = true;
        sphere1.receiveShadow = true;
        sphere1.position.set(0.5, 0.4, -2.0);
        scene.add(sphere1);
        interactableObjects.push({ mesh: sphere1, type: 'sphere', originalEmissive: 0x220044, isGrabbed: false });

        // 创建球体2 (稍小)
        const sphere2Geom = new THREE.SphereGeometry(0.3, 24, 12);
        const sphere2Mat = new THREE.MeshStandardMaterial({ color: 0x66ff99, emissive: 0x003322 });
        const sphere2 = new THREE.Mesh(sphere2Geom, sphere2Mat);
        sphere2.castShadow = true;
        sphere2.receiveShadow = true;
        sphere2.position.set(-0.8, -0.1, -2.5);
        scene.add(sphere2);
        interactableObjects.push({ mesh: sphere2, type: 'sphere', originalEmissive: 0x003322, isGrabbed: false });

        // 为了增加趣味，再加一个环面结？但方块和球已够

        // 抓取状态变量
        let grabbedObject = null;          // 当前被抓住的物体对象 (即interactableObjects中的条目)
        let grabOffset = new THREE.Vector3(); // 物体相对于抓取点(食指指尖)的偏移量

        // --- 更新手部骨架 (MediaPipe结果处理) ---
        function updateHandSkeleton(landmarks, handedness = 'Right') {
            if (!landmarks || landmarks.length !== NUM_LANDMARKS) {
                for (let i = 0; i < NUM_LANDMARKS; i++) {
                    jointMeshes[i].position.set(0, 0, -10);
                }
                const positionAttr = lineGeometry.attributes.position;
                const array = positionAttr.array;
                for (let i = 0; i < array.length; i += 3) {
                    array[i] = 0;
                    array[i+1] = 0;
                    array[i+2] = -10;
                }
                positionAttr.needsUpdate = true;
                lineGeometry.setDrawRange(0, 0);
                handStatusSpan.innerText = '未检测到手';
                return;
            }

            handStatusSpan.innerText = `${handedness}手 (21点)`;

            for (let i = 0; i < NUM_LANDMARKS; i++) {
                const lm = landmarks[i];
                const x = (lm.x - 0.5) * 2 * SCALE;
                const y = (0.5 - lm.y) * 2 * SCALE;
                const z = -lm.z * SCALE * 1.5 - 1.0;
                jointMeshes[i].position.set(x, y, z);
            }

            const positionAttr = lineGeometry.attributes.position;
            const array = positionAttr.array;
            let idx = 0;
            for (let [start, end] of connections) {
                if (start < NUM_LANDMARKS && end < NUM_LANDMARKS) {
                    array[idx] = jointMeshes[start].position.x;
                    array[idx+1] = jointMeshes[start].position.y;
                    array[idx+2] = jointMeshes[start].position.z;
                    array[idx+3] = jointMeshes[end].position.x;
                    array[idx+4] = jointMeshes[end].position.y;
                    array[idx+5] = jointMeshes[end].position.z;
                    idx += 6;
                }
            }
            positionAttr.needsUpdate = true;
            lineGeometry.setDrawRange(0, numSegments * 2);
        }

        // --- MediaPipe Hands 初始化 ---
        async function initMediaPipe() {
            const hands = new window.Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });
            
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    const handedness = results.multiHandedness ? results.multiHandedness[0].label : 'Unknown';
                    updateHandSkeleton(landmarks, handedness);
                } else {
                    updateHandSkeleton(null);
                }
            });

            const camera = new window.Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });
            
            camera.start().catch(error => {
                console.error('摄像头启动失败:', error);
                handStatusSpan.innerText = '摄像头错误';
            });
        }

        initMediaPipe();

        // --- 交互逻辑 (在动画循环中执行，基于最新的jointMeshes位置) ---
        function updateInteraction() {
            // 检查是否有手 (通过第一个关节的z坐标判断)
            if (jointMeshes[0].position.z < -9) {
                // 没有手，如果有被抓住的物体，强制释放? 为了安全，释放
                if (grabbedObject) {
                    grabbedObject.isGrabbed = false;
                    grabbedObject = null;
                }
                // 同时恢复所有物体高亮
                interactableObjects.forEach(obj => {
                    obj.mesh.material.emissive.setHex(obj.originalEmissive);
                });
                return;
            }

            // 获取指尖位置 (世界坐标)
            const thumbPos = jointMeshes[THUMB_TIP].position.clone();
            const indexPos = jointMeshes[INDEX_TIP].position.clone();

            // 计算拇指与食指距离
            const pinchDist = thumbPos.distanceTo(indexPos);

            // 处理抓取与释放
            if (grabbedObject) {
                // 已经抓取了物体: 检查是否释放 (捏合距离变大)
                if (pinchDist > RELEASE_DIST_THRESH) {
                    // 释放物体
                    grabbedObject.mesh.material.emissive.setHex(grabbedObject.originalEmissive);
                    grabbedObject.isGrabbed = false;
                    grabbedObject = null;
                } else {
                    // 继续抓取: 更新物体位置为食指指尖位置 + 偏移量
                    // 也可以使用两指中点，这里简单用食指
                    const targetPos = indexPos.clone().add(grabOffset);
                    grabbedObject.mesh.position.copy(targetPos);
                }
            } else {
                // 没有抓取物体: 检测是否触发抓取 (捏合距离小)
                if (pinchDist < PINCH_DIST_THRESH) {
                    // 寻找最近的物体 (以食指指尖为参考)
                    let closestObj = null;
                    let minDist = Infinity;
                    interactableObjects.forEach(obj => {
                        if (obj.isGrabbed) return; // 理论上不可能，但预防
                        const dist = indexPos.distanceTo(obj.mesh.position);
                        if (dist < GRAB_DIST_THRESH && dist < minDist) {
                            minDist = dist;
                            closestObj = obj;
                        }
                    });
                    if (closestObj) {
                        // 抓取该物体
                        grabbedObject = closestObj;
                        grabbedObject.isGrabbed = true;
                        // 计算偏移量: 物体位置相对于食指指尖
                        grabOffset.copy(grabbedObject.mesh.position).sub(indexPos);
                        // 视觉反馈: 增加发光
                        grabbedObject.mesh.material.emissive.setHex(0x444444); // 抓取时变暗或变亮，随意
                    }
                }
            }

            // 触碰高亮逻辑 (无论是否抓取，未抓取的物体才能高亮，避免干扰)
            interactableObjects.forEach(obj => {
                if (obj.isGrabbed) {
                    // 被抓取的物体保持一种特殊颜色 (或者不变)
                    // 这里我们让它轻微发光表示被抓住，上面已设置
                    return;
                }

                // 检查是否有任何指尖靠近 (使用拇指、食指、中指等，简单起见用食指)
                const distToIndex = indexPos.distanceTo(obj.mesh.position);
                const distToThumb = thumbPos.distanceTo(obj.mesh.position);
                const minDist = Math.min(distToIndex, distToThumb);

                if (minDist < TOUCH_DIST_THRESH) {
                    // 高亮: 增加自发光
                    obj.mesh.material.emissive.setHex(0x553300); // 暖色高亮
                } else {
                    // 恢复原样
                    obj.mesh.material.emissive.setHex(obj.originalEmissive);
                }
            });
        }

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);

            // 星星旋转
            stars.rotation.y += 0.0002;

            // 更新交互 (必须在controls更新前？不影响)
            updateInteraction();

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 窗口自适应 ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        console.log('场景已启动，尝试捏合抓取物体！');
    </script>
</body>
</html>
