<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>纯前端 AR：二维码上方悬浮视频窗口（旋转）</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            font-family: 'Segoe UI', sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 30px;
            z-index: 10;
            pointer-events: none;
            font-size: 14px;
            backdrop-filter: blur(4px);
        }
        #status {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: #ccc;
            z-index: 10;
            pointer-events: none;
            text-shadow: 1px 1px 3px #000;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #canvas3d {
            z-index: 2;
            pointer-events: none;
        }
        #video {
            z-index: 1;
            transform: scaleX(-1); /* 镜像效果，更自然 */
        }
        #hiddenCanvas {
            display: none;
        }
        /* 用于视频纹理的 video 元素不可见 */
        #textureVideo {
            display: none;
        }
    </style>
</head>
<body>
    <div id="info">🎬 扫描二维码，上方出现旋转视频窗口</div>
    <div id="status">🔄 正在启动摄像头...</div>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas3d"></canvas>
    </div>

    <canvas id="hiddenCanvas"></canvas>
    
    <!-- 视频纹理源：播放一个示例视频（可替换为本地/在线视频） -->
    <video id="textureVideo" loop muted crossorigin="anonymous" playsinline>
        <!-- 使用一个公开的测试视频流，支持 CORS -->
        <source src="https://vd3.bdstatic.com/mda-qk8ezrfkpt4cxaw9/sc/cae_h264/1731149052454873468/mda-qk8ezrfkpt4cxaw9.mp4" type="video/mp4">
        您的浏览器不支持 video 标签。
    </video>

    <!-- 依赖库 -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- DOM 元素 ---
        const video = document.getElementById('video');
        const canvas3d = document.getElementById('canvas3d');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
        const statusDiv = document.getElementById('status');
        const textureVideo = document.getElementById('textureVideo');

        // --- 启动纹理视频播放（需要用户手势，我们尝试自动播放）---
        textureVideo.play().catch(e => {
            console.warn('视频自动播放被阻止，请点击页面任意位置启动视频');
            statusDiv.innerText = '⚠️ 点击屏幕以播放视频窗口';
            // 添加一次性点击监听
            document.body.addEventListener('click', () => {
                textureVideo.play();
                statusDiv.innerText = '🔍 扫描中...';
            }, { once: true });
        });

        // --- Three.js 初始化 ---
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);
        
        const renderer = new THREE.WebGLRenderer({ 
            canvas: canvas3d, 
            alpha: true, 
            antialias: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // --- 光照 (让窗口边框有些立体感) ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);
        const backLight = new THREE.PointLight(0x4466ff, 0.3);
        backLight.position.set(-1, 0.5, -2);
        scene.add(backLight);

        // --- 创建视频纹理 ---
        const videoTexture = new THREE.VideoTexture(textureVideo);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        videoTexture.format = THREE.RGBAFormat;

        // --- 创建视频窗口 (平面) ---
        // 设定窗口宽高比与视频一致，或固定比例
        const aspectRatio = 16 / 9; // 宽高比，可根据视频调整
        const planeWidth = 1.8;
        const planeHeight = planeWidth / aspectRatio;
        
        const planeGeometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
        const planeMaterial = new THREE.MeshStandardMaterial({
            map: videoTexture,
            side: THREE.DoubleSide,  // 让背面也可见（旋转时能看到背面视频镜像，可以接受）
            emissive: new THREE.Color(0x222222),
            roughness: 0.4,
            metalness: 0.1
        });
        
        const videoPlane = new THREE.Mesh(planeGeometry, planeMaterial);
        
        // --- 添加一个发光的边框，使其更像“悬浮窗口” ---
        const edges = new THREE.EdgesGeometry(planeGeometry);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x88ccff }));
        videoPlane.add(line); // 边框随平面一起移动旋转
        
        // 添加一个微弱的发光光晕效果（用一个小一点的平面放在后面？简单处理：加一个点光源跟随）
        
        scene.add(videoPlane);
        
        // 初始隐藏，直到检测到二维码
        videoPlane.visible = false;

        // --- 二维码检测相关变量 ---
        let canvasWidth = 640;
        let canvasHeight = 480;
        let qrCorners = null;
        let qrCenter = { x: 0.5, y: 0.5 };
        let qrDetected = false;

        // --- 启动摄像头 ---
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                video.srcObject = stream;
                
                await new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        const videoWidth = video.videoWidth;
                        const videoHeight = video.videoHeight;
                        const maxDim = 800;
                        if (videoWidth > maxDim || videoHeight > maxDim) {
                            const ratio = videoWidth / videoHeight;
                            if (videoWidth > videoHeight) {
                                canvasWidth = maxDim;
                                canvasHeight = maxDim / ratio;
                            } else {
                                canvasHeight = maxDim;
                                canvasWidth = maxDim * ratio;
                            }
                        } else {
                            canvasWidth = videoWidth;
                            canvasHeight = videoHeight;
                        }
                        hiddenCanvas.width = canvasWidth;
                        hiddenCanvas.height = canvasHeight;
                        
                        statusDiv.innerText = '✅ 摄像头已就绪，请对准二维码';
                        resolve();
                    };
                    video.play();
                });

                requestAnimationFrame(tick);
            } catch (err) {
                console.error(err);
                statusDiv.innerText = '❌ 无法访问摄像头';
            }
        }

        // --- 二维码检测 ---
        function detectQRCode() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) return false;
            
            hiddenCtx.drawImage(video, 0, 0, canvasWidth, canvasHeight);
            const imageData = hiddenCtx.getImageData(0, 0, canvasWidth, canvasHeight);
            
            const code = jsQR(imageData.data, canvasWidth, canvasHeight, {
                inversionAttempts: "dontInvert",
            });
            
            if (code) {
                const corners = code.location;
                qrCorners = {
                    topLeft: corners.topLeftCorner,
                    topRight: corners.topRightCorner,
                    bottomRight: corners.bottomRightCorner,
                    bottomLeft: corners.bottomLeftCorner
                };
                
                const centerX = (corners.topLeftCorner.x + corners.topRightCorner.x + corners.bottomRightCorner.x + corners.bottomLeftCorner.x) / 4;
                const centerY = (corners.topLeftCorner.y + corners.topRightCorner.y + corners.bottomRightCorner.y + corners.bottomLeftCorner.y) / 4;
                
                qrCenter = {
                    x: centerX / canvasWidth,
                    y: centerY / canvasHeight
                };
                
                qrDetected = true;
                statusDiv.innerHTML = `📱 检测到: ${code.data.substring(0, 30)}${code.data.length > 30 ? '...' : ''}`;
                return true;
            } else {
                qrDetected = false;
                statusDiv.innerHTML = '🔍 扫描中，将二维码置于画面内...';
                return false;
            }
        }

        // --- 更新视频窗口的位置与基础旋转 ---
        function updatePlaneTransform() {
            if (!qrDetected || !qrCorners) {
                videoPlane.visible = false;
                return;
            }
            
            videoPlane.visible = true;
            
            // 计算世界坐标映射
            const distance = 5;
            const vFOV = camera.fov * Math.PI / 180;
            const heightVisible = 2 * Math.tan(vFOV / 2) * distance;
            const widthVisible = heightVisible * camera.aspect;
            
            const worldX = (qrCenter.x - 0.5) * widthVisible;
            const worldY = -(qrCenter.y - 0.5) * heightVisible;
            
            // 窗口位置：抬高到二维码上方
            videoPlane.position.set(worldX, worldY + 0.8, 0);
            
            // 根据二维码方向调整基础旋转
            if (qrCorners) {
                const tl = qrCorners.topLeft;
                const tr = qrCorners.topRight;
                const upVec = { x: tr.x - tl.x, y: tr.y - tl.y };
                let angle = Math.atan2(upVec.y, upVec.x);
                
                // 保留基础旋转角度，后续会在动画中叠加自转
                videoPlane.userData.baseRotationY = angle;
                
                // 根据二维码大小调整窗口缩放
                const edgeLength = Math.sqrt(upVec.x*upVec.x + upVec.y*upVec.y);
                const scaleFactor = Math.min(Math.max(edgeLength / 150, 0.7), 1.8);
                videoPlane.scale.setScalar(scaleFactor);
            }
        }

        // --- 动画循环 ---
        let time = 0;
        function tick() {
            // 检测二维码
            detectQRCode();
            
            // 更新位置和基础方向
            updatePlaneTransform();
            
            // 让窗口持续旋转 (绕 Y 轴和 X 轴轻微摆动)
            if (videoPlane.visible) {
                time += 0.01;
                // 基础旋转来自二维码方向，再叠加动态旋转
                const baseY = videoPlane.userData.baseRotationY || 0;
                videoPlane.rotation.y = baseY + Math.sin(time * 0.5) * 0.3;
                videoPlane.rotation.x = Math.sin(time * 0.3) * 0.1;
                videoPlane.rotation.z = Math.cos(time * 0.2) * 0.05;
                
                // 确保视频纹理更新
                if (textureVideo.readyState >= textureVideo.HAVE_CURRENT_DATA) {
                    videoTexture.needsUpdate = true;
                }
            }
            
            renderer.render(scene, camera);
            
            requestAnimationFrame(tick);
        }

        // --- 窗口大小自适应 ---
        function handleResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', handleResize);

        // 启动
        startCamera();
    </script>
</body>
</html>
