<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>纯前端 AR：二维码上显示 3D 立方体</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background-color: black;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 30px;
            z-index: 10;
            pointer-events: none;
            font-size: 14px;
        }
        #status {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: #aaa;
            z-index: 10;
            pointer-events: none;
            text-shadow: 1px 1px 3px black;
        }
        /* 视频和 canvas 全屏叠层 */
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Three.js 渲染的 canvas 背景透明，以便看到后面的视频 */
        #canvas3d {
            z-index: 2;
            pointer-events: none;  /* 让点击穿透到视频（如果需要） */
        }
        #video {
            z-index: 1;
            transform: scaleX(-1); /* 镜像，像自拍一样更自然（可选） */
        }
        /* 用于 jsQR 处理的隐藏 canvas */
        #hiddenCanvas {
            display: none;
        }
    </style>
</head>
<body>
    <div id="info">📷 扫描二维码，上方会出现 3D 立方体</div>
    <div id="status">🔄 正在启动摄像头...</div>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas3d"></canvas>
    </div>

    <canvas id="hiddenCanvas"></canvas>

    <!-- 引入依赖库 -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- DOM 元素 ---
        const video = document.getElementById('video');
        const canvas3d = document.getElementById('canvas3d');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
        const statusDiv = document.getElementById('status');

        // --- Three.js 初始化 ---
        const scene = new THREE.Scene();
        
        // 透视相机：根据视频比例动态调整（后续会更新）
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);
        
        const renderer = new THREE.WebGLRenderer({ 
            canvas: canvas3d, 
            alpha: true,  // 背景透明，露出视频
            antialias: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // --- 光照 (让立方体有立体感) ---
        // 环境光
        scene.add(new THREE.AmbientLight(0x404040));
        // 主光源 - 方向光
        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1);
        dirLight1.position.set(1, 2, 1);
        scene.add(dirLight1);
        const dirLight2 = new THREE.DirectionalLight(0xffaa88, 0.5);
        dirLight2.position.set(-2, 1, 2);
        scene.add(dirLight2);
        // 背面补光
        const backLight = new THREE.PointLight(0x4466ff, 0.3);
        backLight.position.set(0, 1, -2);
        scene.add(backLight);

        // --- 创建立方体 (带线框效果更好看) ---
        const cubeSize = 0.8;
        const geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
        // 半透明材质 + 边缘线框
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x00aaff, 
            emissive: new THREE.Color(0x004466),
            roughness: 0.3,
            metalness: 0.1,
            transparent: true,
            opacity: 0.85
        });
        const cube = new THREE.Mesh(geometry, material);
        
        // 添加边缘线框
        const edges = new THREE.EdgesGeometry(geometry);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
        cube.add(line); // 将线框作为立方体的子元素，一起移动旋转
        
        scene.add(cube);

        // 添加一个小的底座平面指示器（可选），用于视觉对齐二维码中心
        const planeGeo = new THREE.PlaneGeometry(1.0, 1.0);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0x3366ff, side: THREE.DoubleSide, transparent: true, opacity: 0.2 });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2; // 平躺
        plane.position.y = -cubeSize/2 - 0.1;
        cube.add(plane);

        // 初始隐藏立方体，直到检测到二维码
        cube.visible = false;

        // 添加一个辅助网格（可选），调试时可取消注释
        // const gridHelper = new THREE.GridHelper(10, 20, 0x888888, 0x444444);
        // scene.add(gridHelper);
        // const axesHelper = new THREE.AxesHelper(5);
        // scene.add(axesHelper);

        // --- 二维码检测相关变量 ---
        let videoWidth = 640;
        let videoHeight = 480;
        let canvasWidth = 640;
        let canvasHeight = 480;
        
        // 存储检测到的二维码角点 (用于计算位置/旋转)
        let qrCorners = null;
        let qrCenter = { x: 0.5, y: 0.5 }; // 归一化坐标 0-1
        let qrDetected = false;

        // --- 启动摄像头 ---
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment', // 优先后置摄像头
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                video.srcObject = stream;
                
                // 等待视频元数据加载
                await new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        videoWidth = video.videoWidth;
                        videoHeight = video.videoHeight;
                        // 设置处理画布大小 (为了性能，可以适当缩小)
                        const maxDim = 800;
                        if (videoWidth > maxDim || videoHeight > maxDim) {
                            const ratio = videoWidth / videoHeight;
                            if (videoWidth > videoHeight) {
                                canvasWidth = maxDim;
                                canvasHeight = maxDim / ratio;
                            } else {
                                canvasHeight = maxDim;
                                canvasWidth = maxDim * ratio;
                            }
                        } else {
                            canvasWidth = videoWidth;
                            canvasHeight = videoHeight;
                        }
                        hiddenCanvas.width = canvasWidth;
                        hiddenCanvas.height = canvasHeight;
                        
                        statusDiv.innerText = '✅ 摄像头已就绪，请对准二维码';
                        resolve();
                    };
                    video.play();
                });

                // 开始检测循环
                requestAnimationFrame(tick);
            } catch (err) {
                console.error('摄像头错误:', err);
                statusDiv.innerText = '❌ 无法访问摄像头，请确保已授权并在 HTTPS/localhost 下运行';
            }
        }

        // --- 二维码检测 (使用 jsQR) ---
        function detectQRCode() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) return false;
            
            // 将当前视频帧绘制到隐藏 canvas 上 (并缩放至处理尺寸)
            hiddenCtx.drawImage(video, 0, 0, canvasWidth, canvasHeight);
            const imageData = hiddenCtx.getImageData(0, 0, canvasWidth, canvasHeight);
            
            // 使用 jsQR 解析
            const code = jsQR(imageData.data, canvasWidth, canvasHeight, {
                inversionAttempts: "dontInvert",
            });
            
            if (code) {
                // 获取角点: location.topLeftCorner, topRightCorner, bottomRightCorner, bottomLeftCorner
                // 这些坐标是相对于 canvasWidth/canvasHeight 的
                const corners = code.location;
                qrCorners = {
                    topLeft: corners.topLeftCorner,
                    topRight: corners.topRightCorner,
                    bottomRight: corners.bottomRightCorner,
                    bottomLeft: corners.bottomLeftCorner
                };
                
                // 计算中心点 (归一化坐标 0~1)
                const centerX = (corners.topLeftCorner.x + corners.topRightCorner.x + corners.bottomRightCorner.x + corners.bottomLeftCorner.x) / 4;
                const centerY = (corners.topLeftCorner.y + corners.topRightCorner.y + corners.bottomRightCorner.y + corners.bottomLeftCorner.y) / 4;
                
                qrCenter = {
                    x: centerX / canvasWidth,
                    y: centerY / canvasHeight
                };
                
                qrDetected = true;
                statusDiv.innerHTML = `📱 检测到二维码: ${code.data}`;
                return true;
            } else {
                qrDetected = false;
                statusDiv.innerHTML = '🔍 扫描中，请将二维码置于画面内...';
                return false;
            }
        }

        // --- 根据二维码位置更新立方体的 3D 位置与旋转 ---
        function updateCubeTransform() {
            if (!qrDetected || !qrCorners) {
                cube.visible = false;
                return;
            }
            
            cube.visible = true;
            
            // 将归一化坐标 (0~1) 映射到 Three.js 世界坐标
            // 我们希望立方体出现在二维码的正上方，并且当二维码在画面边缘时也能正确显示
            // 思路：将屏幕坐标系映射到相机前方的平面 (z = 0 平面)
            // 先计算相机的视口范围在 z=0 处的宽度和高度
            const distance = 5; // 相机到 z=0 平面的距离 (camera.position.z = 5)
            const vFOV = camera.fov * Math.PI / 180;
            const heightVisible = 2 * Math.tan(vFOV / 2) * distance;
            const widthVisible = heightVisible * camera.aspect;
            
            // 将归一化坐标 (0~1) 映射到世界坐标范围：
            // 屏幕坐标原点在左上角，x向右，y向下
            // Three.js 世界坐标：中心在 (0,0)，x向右，y向上
            const worldX = (qrCenter.x - 0.5) * widthVisible;
            const worldY = -(qrCenter.y - 0.5) * heightVisible; // 注意 Y 轴反向
            
            // 设置立方体位置 (z=0 平面，稍微抬高使其浮在二维码上方)
            cube.position.set(worldX, worldY + 0.8, 0);
            
            // --- 计算旋转，使立方体的一面对齐二维码的方向 (基于两个边向量) ---
            if (qrCorners) {
                const tl = qrCorners.topLeft;
                const tr = qrCorners.topRight;
                const br = qrCorners.bottomRight;
                
                // 计算上边向量 (从左上到右上) 和左边向量 (从左上到左下)
                // 但为了稳定，我们计算两个边的平均方向向量
                const upVec = { x: tr.x - tl.x, y: tr.y - tl.y };
                const leftVec = { x: qrCorners.bottomLeft.x - tl.x, y: qrCorners.bottomLeft.y - tl.y };
                
                // 计算二维码在2D图像中的旋转角度 (以弧度表示)
                // 使用上边向量的角度
                let angle = Math.atan2(upVec.y, upVec.x);
                
                // 由于立方体默认朝前，我们让它绕 Y 轴旋转以匹配二维码方向
                // 同时考虑一点绕 X 轴的倾斜 (根据透视效果简单处理)
                cube.rotation.y = angle;
                
                // 轻微绕 X 轴旋转，模拟倾斜 (可选)
                // 计算一个简单的透视缩放因子：二维码越大，立方体越大
                const edgeLength = Math.sqrt(upVec.x*upVec.x + upVec.y*upVec.y);
                const scaleFactor = Math.min(Math.max(edgeLength / 150, 0.6), 1.5);
                cube.scale.setScalar(scaleFactor);
            }
            
            // 添加一点自转动画 (在原有旋转基础上每帧增加)
            // 我们不在 update 里累加，而是保留到动画循环里做
        }

        // --- 动画循环：检测 + 更新 + 渲染 ---
        function tick() {
            // 1. 检测二维码
            detectQRCode();
            
            // 2. 更新立方体位置和基础旋转
            updateCubeTransform();
            
            // 3. 让立方体自身缓慢旋转 (动画效果)
            if (cube.visible) {
                cube.rotation.x += 0.005;
                cube.rotation.z += 0.003;
            }
            
            // 4. 渲染 Three.js 场景
            renderer.render(scene, camera);
            
            // 继续下一帧
            requestAnimationFrame(tick);
        }

        // --- 窗口大小自适应 ---
        function handleResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            
            // 视频画布大小由 CSS 控制，无需额外操作
        }
        window.addEventListener('resize', handleResize);

        // --- 处理视频比例与相机 FOV 的匹配 (确保视觉一致性) ---
        // 由于视频可能不是 16:9，而相机默认 aspect 基于窗口，我们已经在 resize 和初始化时处理了
        
        // --- 启动一切 ---
        startCamera();

        // 简单的初始提示
        console.log('纯前端 AR 示例 - 将二维码置于摄像头前，上方会出现 3D 立方体');
    </script>
</body>
</html>
