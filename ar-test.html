<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>粒子手势系统 · 密码 · 模型 · 时钟</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-color: black;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #aaccff;
            background: rgba(10, 20, 40, 0.6);
            padding: 8px 18px;
            border-radius: 40px;
            backdrop-filter: blur(5px);
            z-index: 20;
            pointer-events: none;
            border-left: 3px solid #3a8cff;
            box-shadow: 0 0 20px rgba(0,80,255,0.2);
        }
        #status {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            text-align: center;
            color: #ccd9ff;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            z-index: 20;
            pointer-events: none;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 2px;
        }
        #gesture-hint {
            position: absolute;
            bottom: 100px;
            left: 20px;
            color: #88aaff;
            background: rgba(20,30,50,0.7);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            backdrop-filter: blur(5px);
            z-index: 20;
            pointer-events: none;
        }
        #video-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #3a6ea5;
            opacity: 0.6;
            z-index: 15;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #video-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="info">🌀 粒子系统 · 手势交互</div>
    <div id="status">✋ 初始化手势识别...</div>
    <div id="gesture-hint">👆 当前状态: 等待密码 (比划 2 两次)</div>
    <div id="video-container">
        <video id="video-preview" autoplay playsinline muted></video>
    </div>
    <canvas id="canvas3d"></canvas>

    <!-- 依赖库 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <!-- OBJ/MTL 加载器 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // ---------- 初始化 Three.js ----------
        const canvas = document.getElementById('canvas3d');
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x050510);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 12);
        camera.lookAt(0, 0, 0);

        // 辅助灯光 (用于模型)
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(1, 3, 2);
        scene.add(dirLight);
        const fillLight = new THREE.PointLight(0x4466ff, 0.5);
        fillLight.position.set(-2, 1, 3);
        scene.add(fillLight);

        // 添加星星背景粒子 (装饰)
        function addStarfield() {
            const geom = new THREE.BufferGeometry();
            const count = 2000;
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i+=3) {
                const r = 50 + Math.random() * 150;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                pos[i] = Math.sin(phi) * Math.cos(theta) * r;
                pos[i+1] = Math.sin(phi) * Math.sin(theta) * r;
                pos[i+2] = Math.cos(phi) * r;
            }
            geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({ color: 0x88aadd, size: 0.15, transparent: true });
            const stars = new THREE.Points(geom, mat);
            scene.add(stars);
        }
        addStarfield();

        // ---------- 全局变量 ----------
        let currentState = 'INIT';       // INIT, MENU, TIME, MODEL, EXIT
        let gesture = 'none';            // 当前识别手势
        let lastGesture = 'none';
        let gestureTimer = 0;
        let passwordStep = 0;            // 0:等待第一次2, 1:环带加速, 2:散开
        let ringSpeed = 0.005;
        const baseRingSpeed = 0.005;
        const fastRingSpeed = 0.03;
        
        // 粒子系统对象
        let textParticles, ringParticles, menuParticles, timeParticles;
        let modelObject = null;
        let modelGroup = new THREE.Group();
        scene.add(modelGroup);
        
        // 时钟相关
        let clockMesh;
        
        // 动画混合
        let explodeProgress = 0;          // 0~1 散开进度
        let explodeActive = false;
        
        // 手势识别相关
        const videoPreview = document.getElementById('video-preview');
        const statusDiv = document.getElementById('status');
        const gestureHint = document.getElementById('gesture-hint');
        
        // 模型加载器
        const mtlLoader = new THREE.MTLLoader();
        const objLoader = new THREE.OBJLoader();

        // ---------- 工具函数：生成文字粒子 ----------
        function createTextParticles(text, color = 0x3a8cff, size = 0.12, spread = 0.8) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600;
            canvas.height = 200;
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'Bold 80px "Segoe UI", "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(text, canvas.width/2, canvas.height/2);
            
            // 扫描像素
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const positions = [];
            const step = 2;
            for (let y = 0; y < canvas.height; y += step) {
                for (let x = 0; x < canvas.width; x += step) {
                    const index = (y * canvas.width + x) * 4;
                    if (data[index] > 128) {
                        const px = (x / canvas.width - 0.5) * spread * 4;
                        const py = -(y / canvas.height - 0.5) * spread * 1.5;
                        positions.push(px, py, 0);
                    }
                }
            }
            
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ 
                color: color, 
                size: size, 
                transparent: true, 
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            return new THREE.Points(geom, mat);
        }

        // 生成环带粒子
        function createRingParticles(radius = 3.2, count = 800, color = 0x5a9cff) {
            const geom = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                pos[i*3] = x;
                pos[i*3+1] = 0;
                pos[i*3+2] = z;
            }
            geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({ color, size: 0.08, transparent: true, blending: THREE.AdditiveBlending });
            return new THREE.Points(geom, mat);
        }

        // 初始化 INIT 场景
        function buildInitScene() {
            if (textParticles) scene.remove(textParticles);
            if (ringParticles) scene.remove(ringParticles);
            
            textParticles = createTextParticles('ENTER PASSWORD', 0x3a8cff, 0.13, 1.0);
            textParticles.position.y = 0.5;
            scene.add(textParticles);
            
            ringParticles = createRingParticles(3.5, 1200, 0x5a9cff);
            ringParticles.position.y = 0.3;
            scene.add(ringParticles);
            
            // 额外小环
            const ring2 = createRingParticles(4.0, 600, 0x88aaff);
            ring2.position.y = 0.2;
            ring2.material.size = 0.05;
            scene.add(ring2);
            ringParticles.userData.ring2 = ring2;
        }

        // 菜单粒子 (显示手势选项)
        function buildMenuScene() {
            if (menuParticles) scene.remove(menuParticles);
            const geom = new THREE.BufferGeometry();
            const count = 1500;
            const pos = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const r = 2.5 + Math.random() * 2.0;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                pos[i*3] = Math.sin(phi) * Math.cos(theta) * r;
                pos[i*3+1] = Math.sin(phi) * Math.sin(theta) * r * 0.6 + 0.5;
                pos[i*3+2] = Math.cos(phi) * r;
                
                colors[i*3] = 0.2 + 0.8 * Math.random();
                colors[i*3+1] = 0.5 + 0.5 * Math.random();
                colors[i*3+2] = 1.0;
            }
            geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.PointsMaterial({ size: 0.1, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending });
            menuParticles = new THREE.Points(geom, mat);
            scene.add(menuParticles);
            
            // 添加中心文字 (使用CSS提示，粒子菜单难以显示清晰文字)
        }

        // 时间粒子 (显示当前时间)
        function updateTimeParticles() {
            if (timeParticles) scene.remove(timeParticles);
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.font = 'Bold 90px "Segoe UI", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#aaccff';
            ctx.fillText(timeStr, canvas.width/2, canvas.height/2);
            
            const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
            const data = imgData.data;
            const positions = [];
            const step = 2;
            for (let y=0; y<canvas.height; y+=step) {
                for (let x=0; x<canvas.width; x+=step) {
                    const idx = (y*canvas.width + x)*4;
                    if (data[idx] > 128) {
                        const px = (x/canvas.width -0.5)*6;
                        const py = -(y/canvas.height -0.5)*3;
                        positions.push(px, py, 0);
                    }
                }
            }
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: 0x88ddff, size: 0.1, blending: THREE.AdditiveBlending });
            timeParticles = new THREE.Points(geom, mat);
            timeParticles.position.y = 0.5;
            scene.add(timeParticles);
        }

        // 加载模型
        function loadModel() {
            modelGroup.clear();
            mtlLoader.setResourcePath('https://threejs.org/examples/models/obj/cerberus/');
            mtlLoader.load('https://github.com/Hmis556/Hmis556/blob/main/3D_PCB1.mtl', (materials) => {
                materials.preload();
                objLoader.setMaterials(materials);
                objLoader.load('https://github.com/Hmis556/Hmis556/blob/main/3D_PCB1.obj', (obj) => {
                    obj.scale.set(0.8, 0.8, 0.8);
                    obj.position.y = -0.2;
                    obj.rotation.y = Math.PI;
                    modelGroup.add(obj);
                });
            });
        }

        // 切换状态
        function setState(newState) {
            currentState = newState;
            explodeActive = false;
            explodeProgress = 0;
            
            // 清理场景
            if (textParticles) scene.remove(textParticles);
            if (ringParticles) {
                scene.remove(ringParticles);
                if (ringParticles.userData.ring2) scene.remove(ringParticles.userData.ring2);
            }
            if (menuParticles) scene.remove(menuParticles);
            if (timeParticles) scene.remove(timeParticles);
            modelGroup.visible = false;
            
            if (newState === 'INIT') {
                buildInitScene();
                passwordStep = 0;
                ringSpeed = baseRingSpeed;
                gestureHint.innerText = '🔐 输入密码: 比划 2 两次';
            } else if (newState === 'MENU') {
                buildMenuScene();
                gestureHint.innerText = '📋 菜单: 1-时钟 2-模型 3-退出';
            } else if (newState === 'TIME') {
                updateTimeParticles();
                gestureHint.innerText = '⏰ 时钟界面 · 比划 3 返回菜单';
            } else if (newState === 'MODEL') {
                if (modelGroup.children.length === 0) loadModel();
                modelGroup.visible = true;
                gestureHint.innerText = '🗿 模型展示 · 比划 3 返回菜单';
            } else if (newState === 'EXIT') {
                // 显示退出粒子，然后回到INIT
                setTimeout(() => setState('INIT'), 1000);
                gestureHint.innerText = '👋 退出系统...';
                statusDiv.innerText = '系统重置';
            }
        }

        // 散开效果
        function startExplode() {
            explodeActive = true;
            explodeProgress = 0;
            statusDiv.innerText = '✨ 密码正确！进入主菜单';
        }

        // 手势识别逻辑 (基于MediaPipe关键点)
        function detectGesture(landmarks) {
            if (!landmarks) return 'none';
            // 简化：通过手指角度判断
            const tips = [4,8,12,16,20];
            const dips = [3,6,10,14,18];
            let extended = [false, false, false, false, false];
            
            for (let i=0; i<5; i++) {
                const tip = landmarks[tips[i]];
                const dip = landmarks[dips[i]];
                if (tip.y < dip.y - 0.03) extended[i] = true;
            }
            // 大拇指单独判断 (横向)
            const thumbTip = landmarks[4];
            const thumbMcp = landmarks[2];
            if (Math.abs(thumbTip.x - thumbMcp.x) > 0.07 && thumbTip.y < thumbMcp.y) extended[0] = true;
            
            const count = extended.filter(v=>v).length;
            if (count === 1 && extended[1]) return 'one';
            if (count === 2 && extended[1] && extended[2]) return 'two';
            if (count === 3 && extended[1] && extended[2] && extended[3]) return 'three';
            if (count === 5) return 'five';
            return 'none';
        }

        // 手势处理状态机
        function processGesture(gest) {
            if (gest === lastGesture) return;
            lastGesture = gest;
            
            if (currentState === 'INIT') {
                if (gest === 'two') {
                    if (passwordStep === 0) {
                        passwordStep = 1;
                        ringSpeed = fastRingSpeed;
                        statusDiv.innerText = '⚡ 环带加速，再次比划2确认';
                    } else if (passwordStep === 1) {
                        passwordStep = 2;
                        startExplode();
                    }
                }
            } else if (currentState === 'MENU') {
                if (gest === 'one') setState('TIME');
                else if (gest === 'two') setState('MODEL');
                else if (gest === 'three') setState('EXIT');
            } else if (currentState === 'TIME' || currentState === 'MODEL') {
                if (gest === 'three') setState('MENU');
            }
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新环带旋转
            if (ringParticles && currentState === 'INIT') {
                ringParticles.rotation.y += ringSpeed;
                if (ringParticles.userData.ring2) ringParticles.userData.ring2.rotation.y += ringSpeed * 1.3;
                if (textParticles) textParticles.rotation.y += 0.002;
            }
            
            // 散开动画
            if (explodeActive) {
                explodeProgress += 0.02;
                if (explodeProgress >= 1) {
                    explodeActive = false;
                    setState('MENU');
                } else {
                    // 粒子向外扩散
                    if (textParticles) {
                        const posAttr = textParticles.geometry.attributes.position;
                        const array = posAttr.array;
                        for (let i=0; i<array.length; i+=3) {
                            array[i] *= (1 + explodeProgress * 0.5);
                            array[i+1] *= (1 + explodeProgress * 0.5);
                            array[i+2] *= (1 + explodeProgress * 0.5);
                        }
                        posAttr.needsUpdate = true;
                    }
                    if (ringParticles) {
                        ringParticles.material.opacity = 1 - explodeProgress;
                        if (ringParticles.userData.ring2) ringParticles.userData.ring2.material.opacity = 1 - explodeProgress;
                    }
                }
            }
            
            // 时间界面每秒更新
            if (currentState === 'TIME') {
                if (Math.floor(Date.now() / 1000) % 2 === 0) updateTimeParticles();
            }
            
            // 模型旋转
            if (currentState === 'MODEL' && modelGroup.visible) {
                modelGroup.rotation.y += 0.01;
            }
            
            // 菜单粒子旋转
            if (menuParticles && currentState === 'MENU') {
                menuParticles.rotation.y += 0.005;
                menuParticles.rotation.x += 0.001;
            }
            
            // 相机轻微运动
            camera.position.x = Math.sin(Date.now() * 0.0005) * 2;
            camera.position.y = 2 + Math.sin(Date.now() * 0.0008) * 0.3;
            camera.lookAt(0, 0.5, 0);
            
            renderer.render(scene, camera);
        }
        animate();

        // 窗口大小自适应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ---------- MediaPipe Hands 初始化 ----------
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.5
        });
        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const gest = detectGesture(landmarks);
                gesture = gest;
                processGesture(gest);
                statusDiv.innerText = `👆 识别手势: ${gest} | 状态: ${currentState}`;
            } else {
                gesture = 'none';
                statusDiv.innerText = `🔍 未检测到手 | 状态: ${currentState}`;
            }
        });

        // 摄像头启动
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                videoPreview.srcObject = stream;
                videoPreview.play();
                
                const sendFrame = async () => {
                    if (videoPreview.readyState === 4) {
                        await hands.send({ image: videoPreview });
                    }
                    requestAnimationFrame(sendFrame);
                };
                sendFrame();
                statusDiv.innerText = '✅ 手势识别已启动';
            } catch(e) {
                statusDiv.innerText = '❌ 摄像头访问失败，请确保 HTTPS 环境';
            }
        }
        startCamera();

        // 初始化
        setState('INIT');
        loadModel(); // 预加载模型
    </script>
</body>
</html>
